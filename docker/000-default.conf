<VirtualHost *:8080>
    ServerName bulk-firefly.local
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -Includes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"
    Header always set Cache-Control "no-store"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
